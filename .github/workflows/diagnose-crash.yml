name: Teste de abertura no emulador

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID da execucao do build "Android APK (build local)" cujo APK sera testado
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Abrir o app no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Baixar APK do build
        uses: actions/download-artifact@v4
        with:
          name: cobrinha-apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador e teste
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/emulator-smoke.sh apk/app-release.apk out

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: out
          if-no-files-found: warn
