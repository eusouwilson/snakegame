name: Find Expo project id (temporario)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar projeto no Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          for name in snakegamer snake-game snakegame; do
            echo "== @wilsoncx/$name"
            curl -sS https://api.expo.dev/graphql \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"{ app { byFullName(fullName: \\\"@wilsoncx/$name\\\") { id slug name } } }\"}" \
              | jq -c '.data.app.byFullName // .errors[0].message'
          done
