name: EAS Build (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil do eas.json
        type: choice
        default: preview
        options:
          - preview
          - production
          - development

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verificar EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Secret EXPO_TOKEN nao configurado (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Android
        run: >
          eas build
          --platform android
          --profile ${{ github.event.inputs.profile || 'preview' }}
          --non-interactive
          --no-wait
